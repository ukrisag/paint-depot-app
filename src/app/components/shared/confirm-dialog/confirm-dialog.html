@if (notificationService.confirmDialog$ | async; as dialog) {
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" (click)="cancel(dialog)">
    <!-- Dialog -->
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 animate-fade-in" (click)="$event.stopPropagation()">
      <!-- Message -->
      <p class="text-gray-900 mb-6">{{ dialog.message }}</p>

      <!-- Actions -->
      <div class="flex gap-3 justify-end">
        <button
          (click)="cancel(dialog)"
          class="px-4 py-2 text-gray-600 hover:text-gray-900 transition-colors"
        >
          {{ dialog.cancelText || 'ยกเลิก' }}
        </button>
        <button
          (click)="confirm(dialog)"
          class="px-4 py-2 bg-primary-600 text-white hover:bg-gray-700 transition-colors"
        >
          {{ dialog.confirmText || 'ยืนยัน' }}
        </button>
      </div>
    </div>
  </div>
}
