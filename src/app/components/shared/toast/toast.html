<div class="fixed top-4 right-4 z-50 space-y-2">
  @for (toast of (notificationService.toasts$ | async) || []; track toast.id) {
    <div
      class="min-w-64 px-4 py-3 rounded-lg shadow-lg flex items-center justify-between gap-3 animate-slide-in"
      [ngClass]="{
        'bg-green-50 text-green-900 border border-green-200': toast.type === 'success',
        'bg-red-50 text-red-900 border border-red-200': toast.type === 'error',
        'bg-primary-50 text-blue-900 border border-blue-200': toast.type === 'info'
      }"
    >
      <div class="flex items-center gap-2">
        <!-- Icon -->
        @if (toast.type === 'success') {
          <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        }
        @if (toast.type === 'error') {
          <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        }
        @if (toast.type === 'info') {
          <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        }

        <!-- Message -->
        <span class="text-sm font-medium">{{ toast.message }}</span>
      </div>

      <!-- Close button -->
      <button (click)="removeToast(toast.id)" class="text-gray-400 hover:text-gray-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  }
</div>
