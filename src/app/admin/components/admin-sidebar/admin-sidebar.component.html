<aside
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
  class="w-64 bg-white h-[calc(100vh-4rem)] shadow-lg transform transition-transform duration-300 ease-in-out lg:translate-x-0">

  <div class="h-full flex flex-col">
    <!-- Sidebar Header -->
    <div class="p-6 border-b border-gray-200">
      <h2 class="text-xl font-bold text-gray-800">ระบบจัดการ</h2>
      <p class="text-sm text-gray-500 mt-1">Paint Depot Admin</p>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 overflow-y-auto py-4">
      <ul class="space-y-1 px-3">
        @for (item of menuItems; track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-primary-50 text-primary-600 border-l-4 border-primary-600"
              [routerLinkActiveOptions]="{exact: false}"
              (click)="onClose()"
              class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors duration-200 border-l-4 border-transparent">
              <span class="text-2xl">{{ item.icon }}</span>
              <span class="font-medium">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-gray-200">
      <div class="text-xs text-gray-500 text-center">
        <p>Paint Depot Admin Panel</p>
        <p class="mt-1">Version 1.0.0</p>
      </div>
    </div>
  </div>
</aside>
